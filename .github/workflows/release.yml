name: Release

# Push a tag like v0.2.0 to build a signed APK and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing. See README → Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle testReleaseUnitTest assembleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="$((GITHUB_RUN_NUMBER + 1))"
          cp app/build/outputs/apk/release/app-release.apk "tablighgir-$GITHUB_REF_NAME.apk"

      - name: Check the app has no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          test -x "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          for apk in "tablighgir-$GITHUB_REF_NAME.apk"; do
            "$AAPT" dump permissions "$apk" > perms.txt
            cat perms.txt
            if grep -q "android.permission.INTERNET" perms.txt; then
              echo "::error::$apk requests internet access. Tabligh-gir must stay offline."
              exit 1
            fi
          done

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "tablighgir-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "tablighgir-$GITHUB_REF_NAME.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "tablighgir-$GITHUB_REF_NAME.apk" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
