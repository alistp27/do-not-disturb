name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build
        run: gradle testDebugUnitTest assembleDebug assembleRelease
      - name: Check the app has no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          test -x "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          for apk in app/build/outputs/apk/*/*.apk; do
            "$AAPT" dump permissions "$apk" > perms.txt
            cat perms.txt
            if grep -q "android.permission.INTERNET" perms.txt; then
              echo "::error::$apk requests internet access. Tabligh-gir must stay offline."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tablighgir-debug
          path: app/build/outputs/apk/debug/app-debug.apk
